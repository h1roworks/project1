# ============ LLM 配置 ============
llm:
  provider: "dashscope"            # dashscope | openai | azure | ollama | deepseek
  model: "qwen-plus"
  api_key: "${DASHSCOPE_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  temperature: 0.1
  max_tokens: 2048
  # 使用 Azure OpenAI（provider=azure）时的专用配置：
  # azure_endpoint: "https://xxx.openai.azure.com/"
  # api_version: "2024-06-01"
  # deployment_name: "your-deployment"

# ============ Embedding 配置 ============
embedding:
  provider: "dashscope"            # dashscope | openai | azure | ollama
  model: "text-embedding-v3"
  api_key: "${DASHSCOPE_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  dimensions: 1024
  batch_size: 32
  max_input_chars: 0               # 单条输入超长截断上限（字符），0 = 不截断
  # 使用 Azure OpenAI（provider=azure）时的专用配置：
  # azure_endpoint: "https://xxx.openai.azure.com/"
  # api_version: "2024-06-01"
  # deployment_name: "your-embedding-deployment"

# ============ Vision LLM 配置（图片描述） ============
vision_llm:
  provider: "dashscope"            # dashscope | azure | openai
  model: "qwen-vl-plus"
  api_key: "${DASHSCOPE_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  max_tokens: 1024
  max_image_size: 2048             # 图片最长边超过此值时自动等比压缩（px）
  # 使用 Azure OpenAI（provider=azure）时的专用配置：
  # azure_endpoint: "https://xxx.openai.azure.com/"
  # api_version: "2024-06-01"
  # deployment_name: "your-deployment"

# ============ 向量存储配置 ============
vector_store:
  provider: "chroma"               # chroma | qdrant
  collection: "knowledge_hub"
  persist_dir: "data/db/chroma"

# ============ 检索配置 ============
retrieval:
  top_k: 10
  dense_top_k: 20                  # Dense 召回候选数
  sparse_top_k: 20                 # Sparse 召回候选数
  fusion_k: 60                     # RRF 融合常数 k
  # 元数据硬过滤字段（为空则不做 pre-filter）
  hard_filters: []

# ============ 切分配置 ============
splitter:
  strategy: "recursive"            # recursive | semantic | fixed
  chunk_size: 1000
  chunk_overlap: 200
  # 自定义分隔符（默认按 Markdown 结构递归切分；留空则用内置分隔符）
  separators: []

# ============ 重排配置 ============
rerank:
  provider: "none"                 # none | cross_encoder | llm
  enabled: false
  top_m: 10                        # 参与精排的候选数
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  timeout_seconds: 10

# ============ 评估配置 ============
evaluation:
  provider: "composite"            # ragas | custom | composite
  metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_relevancy"
  golden_test_set_path: "tests/fixtures/golden_test_set.json"

# ============ 可观测性配置 ============
observability:
  log_dir: "logs"
  trace_file: "logs/traces.jsonl"
  app_log: "logs/app.log"
  dashboard:
    host: "localhost"
    port: 8501
