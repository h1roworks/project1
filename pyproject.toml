[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-v1"
version = "0.1.0"
description = "Knowledge Hub v1 — a modular RAG system with MCP tools and an observable Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "markitdown[pdf]>=0.1",
    "langchain-text-splitters>=0.2",
    "chromadb>=0.5",
    "openai>=1.30",
    "ollama>=0.3",
    "pillow>=10.0",
    "mcp>=1.0",
    "streamlit>=1.36",
    "ragas>=0.2",
    "rank-bm25>=0.2",
]

keywords = ["rag", "mcp", "knowledge-base", "streamlit", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "reportlab>=4.0",  # 测试用：生成 PDF 样例
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: unit tests (fast, no external deps)",
    "integration: integration tests (may touch real backends)",
    "e2e: end-to-end tests (full pipeline)",
]
addopts = "-q"
